ddle" letter-spacing="0.06em">CONFIDENT</text><path d="M548,176 V188 Q548,196 540,196 H420 Q412,196 412,204 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M588,176 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><path d="M628,176 V188 Q628,196 636,196 H756 Q764,196 764,204 V216" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/><rect x="20" y="116" width="96" height="40" rx="20" fill="#f5f5f5"/><rect x="20" y="116" width="96" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="68.0" y="140.0" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">Query</text><rect x="140" y="96" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="140" y="96" width="160" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/><rect x="148" y="104" width="42" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.4" stroke-width="0.8"/><text x="169.0" y="113" fill="#2d3142" font-size="7" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">TIER 0</text><text x="220.0" y="132.0" fill="#2d3142" font-size="12" font-weight="600" font-family="Geist, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">BM25</text><text x="220.0" y="148.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">FTS5 + doc graph</text><text x="220.0" y="161.0" fill="#4f5d75" font-size="9" font-weight="400" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">no model · ~1 ms</text><rect x="324" y="96" width="160" height="80" rx="6" fill="#f5f5f5"/><rect x="324" y