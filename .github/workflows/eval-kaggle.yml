name: Eval - Kaggle GPU

# Retrieval quality (nDCG, recall) of scripts/bench.sh on a free Kaggle GPU.
# Flow and one-time setup: research/kaggle-eval.md. Speed numbers from Kaggle
# are not comparable with a local GPU; no preship speed floors apply here.

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset
        type: choice
        # ^ fiqa and miracl-ko/zh run on a 10000-doc pool; miracl needs a Linux lindera dataset (research/kaggle-eval.md).
        options: [scifact, nfcorpus, fiqa, miracl-ko, miracl-zh]
        default: scifact
      mode:
        description: bench.sh --mode
        type: choice
        options: [all, bm25, vector, hybrid]
        default: all
      accelerator:
        description: Kaggle machine shape
        default: NvidiaTeslaT4
      fetch:
        description: Only download the output of this kernel (<slug> or <slug>/<version>); no build, no run
        default: ""

permissions:
  contents: read

concurrency:
  group: eval-kaggle-${{ inputs.fetch || inputs.dataset }}
  cancel-in-progress: false

jobs:
  build:
    if: inputs.fetch == ''
    uses: ./.github/workflows/eval-build.yml

  kaggle:
    name: Kaggle run (${{ inputs.dataset }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaggle-cli
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ir-bundle
          path: bundle
      - name: Run on Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          DATASET: ${{ inputs.dataset }}
          MODE: ${{ inputs.mode }}
          ACCEL: ${{ inputs.accelerator }}
        run: scripts/kaggle/ci.sh "$DATASET" "$MODE" "$ACCEL" bundle kaggle-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: eval-${{ inputs.dataset }}
          path: |
            kaggle-out/**/*.json
            kaggle-out/**/*.log
            kaggle-out/**/*.txt
            !kaggle-out/**/dataset-metadata.json
          if-no-files-found: warn

  # ^ A CPU session can outlast the Kaggle job's wait (scifact mode all: 12 h, run 43168270510).
  #   This collects whatever a finished or stopped session left (research/kaggle-eval.md).
  fetch:
    name: Fetch Kaggle output (${{ inputs.fetch }})
    if: inputs.fetch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/kaggle-cli
      - name: Fetch output
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          FETCH: ${{ inputs.fetch }}
        run: scripts/kaggle/ci.sh fetch "$FETCH" kaggle-out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: kaggle-output
          path: |
            kaggle-out/**/*.json
            kaggle-out/**/*.log
            kaggle-out/**/*.txt
            !kaggle-out/**/dataset-metadata.json
          if-no-files-found: warn
