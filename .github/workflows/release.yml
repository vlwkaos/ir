name: CD - release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: taiki-e/install-action@cca35edeb1d01366c2843b68fc3ca441446d73d3 # v2.77.1
        with:
          tool: cargo-shear
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # ^ The binary reports Cargo.toml's version, and the daemon upgrade rule
      #   compares it, so a tag that disagrees would ship a mislabeled build.
      - name: Tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CRATE=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          if [ "${TAG#v}" != "$CRATE" ]; then
            echo "tag $TAG does not match Cargo.toml version $CRATE" >&2
            exit 1
          fi

      - name: Build
        run: cargo build --no-default-features --features llama-openmp

      - name: Test
        run: cargo test --no-default-features --features llama-openmp

      - name: Unused dependencies
        run: cargo shear

  build-macos:
    name: macOS (universal)
    needs: [check]
    runs-on: macos-14
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: macos
          save-if: false

      - name: Build ir (aarch64)
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: cargo build --release --target aarch64-apple-darwin --bin ir

      - name: Build ir (x86_64)
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: cargo build --release --target x86_64-apple-darwin --bin ir

      - name: Package ir (universal)
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          lipo -create -output ir \
            target/aarch64-apple-darwin/release/ir \
            target/x86_64-apple-darwin/release/ir
          tar -czf "ir-${VERSION}-darwin-universal.tar.gz" ir
          rm -f ir

      - name: Build Homebrew bottle
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BOTTLE_DIR=$(mktemp -d)
          mkdir -p "$BOTTLE_DIR/ir/${VERSION}/bin"
          lipo -create -output "$BOTTLE_DIR/ir/${VERSION}/bin/ir" \
            target/aarch64-apple-darwin/release/ir \
            target/x86_64-apple-darwin/release/ir
          tar -czf "ir-${VERSION}.all.bottle.tar.gz" -C "$BOTTLE_DIR" ir
          rm -rf "$BOTTLE_DIR"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          path: '*.tar.gz'

  build-linux-x86_64:
    name: Linux x86_64
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: linux-x86_64
          save-if: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build ir
        run: |
          cargo build --release --bin ir \
            --no-default-features --features llama-openmp

      - name: Package ir
        run: tar -czf ir-linux-x86_64.tar.gz -C target/release ir

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: '*.tar.gz'

  build-linux-aarch64:
    name: Linux aarch64
    needs: [check]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: linux-aarch64
          save-if: false

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: Build ir
        run: |
          cargo build --release --bin ir \
            --no-default-features --features llama-openmp

      - name: Package ir
        run: tar -czf ir-linux-aarch64.tar.gz -C target/release ir

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-aarch64
          path: '*.tar.gz'

  release:
    name: Release
    needs: [build-macos, build-linux-x86_64, build-linux-aarch64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum *.tar.gz | sort > SHA256SUMS

      - name: List release assets
        run: ls -lh *.tar.gz SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          case "$TAG" in
            *-*)
              # ^ Release candidate: notes come from Unreleased, and a
              #   prerelease is never "latest", so nothing installs it by default.
              awk '/^## \[Unreleased\]/{found=1; next} found && /^## \[/{exit} found{print}' CHANGELOG.md > release-notes.md
              gh release create "$TAG" --prerelease --notes-file release-notes.md *.tar.gz SHA256SUMS
              ;;
            *)
              awk "/^## \[$VERSION\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md > release-notes.md
              gh release create "$TAG" --notes-file release-notes.md *.tar.gz SHA256SUMS
              ;;
          esac

      # ^ Release candidates (tags with a "-", e.g. v0.19.0-rc.1) stop here:
      #   no Homebrew tap update and no crates.io publish.
      - name: Update Homebrew tap
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          TARBALL="ir-${VERSION}-darwin-universal.tar.gz"
          BOTTLE="ir-${VERSION}.all.bottle.tar.gz"
          SHA256=$(grep "$TARBALL" SHA256SUMS | awk '{print $1}')
          BOTTLE_SHA256=$(grep "$BOTTLE" SHA256SUMS | awk '{print $1}')
          DESC=$(grep '^description' Cargo.toml | head -1 | sed 's/description = "\(.*\)"/\1/')

          gh auth setup-git
          gh repo clone vlwkaos/homebrew-tap tap-repo
          cat > tap-repo/Formula/ir.rb <<FORMULA
          class Ir < Formula
            desc "${DESC}"
            homepage "https://github.com/vlwkaos/ir"
            url "https://github.com/vlwkaos/ir/releases/download/${TAG}/${TARBALL}"
            version "${VERSION}"
            sha256 "${SHA256}"
            license "MIT"

            bottle do
              root_url "https://github.com/vlwkaos/ir/releases/download/${TAG}"
              sha256 cellar: :any_skip_relocation, all: "${BOTTLE_SHA256}"
            end

            def install
              bin.install "ir"
            end

            test do
              assert_predicate bin/"ir", :executable?
            end
          end
          FORMULA

          cd tap-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/ir.rb
          git commit -m "ir ${VERSION}"
          git push

  publish:
    name: Publish to crates.io
    needs: [release]
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Publish ir-search
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish
