name: Kaggle CLI
description: Pinned, hash-checked kaggle CLI (scripts/kaggle/requirements.txt) on PATH. Needs a checkout.

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Kaggle CLI (pinned, hashed)
      shell: bash
      run: |
        uv venv "$RUNNER_TEMP/kaggle-venv" --python 3.12
        VIRTUAL_ENV="$RUNNER_TEMP/kaggle-venv" uv pip install --require-hashes -r scripts/kaggle/requirements.txt
        echo "$RUNNER_TEMP/kaggle-venv/bin" >> "$GITHUB_PATH"
